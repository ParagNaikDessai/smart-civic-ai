<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Outer hexagon frame -->
  <polygon points="250,50 423,150 423,350 250,450 77,350 77,150" fill="url(#brandGrad)" />
  
  <!-- Inner hexagon nodes layout (Connecting AI matrix) -->
  <polygon points="250,110 371,180 371,320 250,390 129,320 129,180" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="8,4" />
  
  <!-- Node connectors -->
  <line x1="250" y1="250" x2="250" y2="110" stroke="#ffffff" stroke-width="3" opacity="0.7" />
  <line x1="250" y1="250" x2="371" y2="180" stroke="#ffffff" stroke-width="3" opacity="0.7" />
  <line x1="250" y1="250" x2="371" y2="320" stroke="#ffffff" stroke-width="3" opacity="0.7" />
  <line x1="250" y1="250" x2="250" y2="390" stroke="#ffffff" stroke-width="3" opacity="0.7" />
  <line x1="250" y1="250" x2="129" y2="320" stroke="#ffffff" stroke-width="3" opacity="0.7" />
  <line x1="250" y1="250" x2="129" y2="180" stroke="#ffffff" stroke-width="3" opacity="0.7" />
  
  <!-- Central Hub Node (AI Engine) -->
  <circle cx="250" cy="250" r="32" fill="url(#accentGrad)" />
  <circle cx="250" cy="250" r="16" fill="#ffffff" />
  
  <!-- Perimeter Nodes -->
  <circle cx="250" cy="110" r="12" fill="#3b82f6" />
  <circle cx="371" cy="180" r="12" fill="#10b981" />
  <circle cx="371" cy="320" r="12" fill="#3b82f6" />
  <circle cx="250" cy="390" r="12" fill="#10b981" />
  <circle cx="129" cy="320" r="12" fill="#3b82f6" />
  <circle cx="129" cy="180" r="12" fill="#10b981" />
</svg>
